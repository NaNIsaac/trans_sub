[project]
name = "trans-sub"
version = "0.1.0"
description = "Skeleton project for working with .srt subtitle files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "srt>=3.5.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
