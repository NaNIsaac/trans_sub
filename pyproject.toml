[project]
name = "trans-sub"
version = "0.1.0"
description = "Translate .srt subtitle files from a translation table or an LLM provider, and check the result"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pysubtrans>=1.8.0",
    "srt>=3.5.3",
]

[project.optional-dependencies]
openai = ["pysubtrans[openai]"]
azure = ["pysubtrans[azure]"]
gemini = ["pysubtrans[gemini]"]
claude = ["pysubtrans[claude]"]
mistral = ["pysubtrans[mistral]"]
bedrock = ["pysubtrans[bedrock]"]
litellm = ["pysubtrans[litellm]"]
youtube = [
    "google-api-python-client>=2.180.0",
    "google-auth-oauthlib>=1.2.2",
]

[project.scripts]
trans-sub = "trans_sub.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
