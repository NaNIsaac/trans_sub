[project]
name = "trans-sub"
version = "0.1.0"
description = "Skeleton project for working with .srt subtitle files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "srt>=3.5.3",
]

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"main.py" = ["F401", "I001"]
